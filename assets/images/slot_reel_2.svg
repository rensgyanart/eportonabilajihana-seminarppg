<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="50%" stop-color="#0D1730"/>
      <stop offset="100%" stop-color="#070D1E"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#gridPattern)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1040" height="1880" rx="24" fill="none" stroke="rgba(255, 210, 0,0.25)" stroke-width="2" stroke-dasharray="10 6"/>

  <!-- Center Icon Graphic -->
  <g transform="translate(540.0, 910.0)">
    <!-- Outer Glow Circle -->
    <circle r="60" fill="rgba(255, 210, 0,0.08)" stroke="#FFD200" stroke-width="2"/>
    
    <!-- Camera / Artifact Icon -->
    <rect x="-30" y="-18" width="60" height="42" rx="8" fill="none" stroke="#FFD200" stroke-width="3"/>
    <circle cx="0" cy="3" r="13" fill="none" stroke="#FFD200" stroke-width="3"/>
    <circle cx="0" cy="3" r="4" fill="#FFD200"/>
    <path d="M-14 -18 L-8 -26 L8 -26 L14 -18 Z" fill="none" stroke="#FFD200" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Top Pill Badge -->
  <g transform="translate(540.0, 70)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#FFD200"/>
    <text x="0" y="5" fill="#0A1128" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">VIDEO PRAKTIK PEMBELAJARAN</text>
  </g>

  <!-- Typography Content -->
  <text x="540.0" y="1020.0" fill="#ffffff" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="-0.5">VIDEO 2: PRAKTIK PEMBELAJARAN</text>
  <text x="540.0" y="1055.0" fill="rgba(255,255,255,0.65)" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Simulasi Pembelajaran Berpihak pada Murid</text>
  
  <text x="540.0" y="1870" fill="#FFD200" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">Nabila Jihan Athifah, S.Ds.  •  Seminar PPG Calon Guru 2026</text>
</svg>